<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MinionHQ</title>
  <link rel="stylesheet" href="/vendor/xterm.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">copilot<span>-multi</span></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="actions">
      <button id="open-context" title="Repo context (⌘.)">📚 context</button>
      <button id="resume-session" title="Resume a previous session">↻ resume</button>
      <button id="new-session" title="New session (⌘T)">+ new</button>
    </div>
  </header>
  <main id="panes"></main>
  <aside id="context-drawer" class="drawer" aria-hidden="true">
    <div class="drawer-head">
      <div class="drawer-title">Repo context</div>
      <button class="drawer-close" id="close-context" title="Close (Esc)">✕</button>
    </div>
    <div class="drawer-meta" id="ctx-meta"></div>
    <div class="drawer-body">
      <div class="ctx-list" id="ctx-list"></div>
      <div class="ctx-editor">
        <input type="text" id="ctx-filename" placeholder="filename.md" />
        <textarea id="ctx-content" placeholder="Markdown content shared across every session on this repo, on any branch."></textarea>
        <div class="ctx-actions">
          <button id="ctx-save">Save</button>
          <button id="ctx-new" class="secondary">New file</button>
          <button id="ctx-delete" class="danger">Delete</button>
          <span class="ctx-status" id="ctx-status"></span>
        </div>
      </div>
    </div>
  </aside>
  <footer class="status">
    <span id="conn-state">connecting…</span>
    <span class="spacer"></span>
    <button class="toggle" id="toggle-chimes" data-on="1" title="play chimes on status changes">🔔 chimes</button>
    <button class="toggle" id="toggle-notify" data-on="1" title="OS notifications on status changes">📨 notify</button>
    <span class="sep">·</span>
    <span id="hint">⌘T new · ⌘W close · ⌘1..9 switch</span>
  </footer>
  <script type="module" src="/app.js"></script>
</body>
</html>
