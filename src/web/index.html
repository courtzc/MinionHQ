<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>copilot-multi</title>
  <link rel="stylesheet" href="/vendor/xterm.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">copilot<span>-multi</span></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="actions">
      <button id="new-session" title="New session (⌘T)">+ new</button>
    </div>
  </header>
  <main id="panes"></main>
  <footer class="status">
    <span id="conn-state">connecting…</span>
    <span class="spacer"></span>
    <button class="toggle" id="toggle-chimes" data-on="1" title="play chimes on status changes">🔔 chimes</button>
    <button class="toggle" id="toggle-notify" data-on="1" title="OS notifications on status changes">📨 notify</button>
    <span class="sep">·</span>
    <span id="hint">⌘T new · ⌘W close · ⌘1..9 switch</span>
  </footer>
  <script type="module" src="/app.js"></script>
</body>
</html>
