<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <!-- Body: warm yellow with subtle vertical gradient -->
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffe066"/>
      <stop offset="55%" stop-color="#facd2e"/>
      <stop offset="100%" stop-color="#e0b417"/>
    </linearGradient>

    <!-- Body left-edge soft shadow -->
    <linearGradient id="bodyShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#000" stop-opacity="0.18"/>
      <stop offset="22%" stop-color="#000" stop-opacity="0"/>
      <stop offset="78%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Top highlight strip -->
    <linearGradient id="bodyHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <!-- Overalls: deep denim blue with vertical gradient -->
    <linearGradient id="denimGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#3d6fb0"/>
      <stop offset="100%" stop-color="#264e83"/>
    </linearGradient>

    <!-- Goggle ring: brushed chrome -->
    <linearGradient id="chromeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#f3f3f3"/>
      <stop offset="35%" stop-color="#cfcfcf"/>
      <stop offset="65%" stop-color="#8e8e8e"/>
      <stop offset="100%" stop-color="#6a6a6a"/>
    </linearGradient>

    <!-- Iris radial -->
    <radialGradient id="irisGrad" cx="55%" cy="40%" r="65%">
      <stop offset="0%"  stop-color="#9c6a37"/>
      <stop offset="55%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#2c1a0a"/>
    </radialGradient>

    <!-- Soft ground shadow -->
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <!-- Capsule clip for body decorations -->
    <clipPath id="bodyClip">
      <rect x="40" y="22" width="176" height="206" rx="88" ry="88"/>
    </clipPath>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="128" cy="240" rx="74" ry="8" fill="url(#shadowGrad)"/>

  <!-- Body capsule -->
  <rect x="40" y="22" width="176" height="206" rx="88" ry="88" fill="url(#bodyGrad)"/>
  <rect x="40" y="22" width="176" height="206" rx="88" ry="88" fill="url(#bodyShade)"/>

  <!-- Top highlight inside capsule -->
  <g clip-path="url(#bodyClip)">
    <ellipse cx="100" cy="60" rx="56" ry="22" fill="url(#bodyHi)"/>
  </g>

  <!-- Hair tufts -->
  <g stroke="#2a1e10" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M88 24  q-3 -10 -8 -16"/>
    <path d="M108 19 q-1 -10 -3 -16"/>
    <path d="M128 17 q0 -10 0 -16"/>
    <path d="M148 19 q1 -10 3 -16"/>
    <path d="M168 24 q3 -10 8 -16"/>
  </g>

  <!-- Overalls bottom (clipped to capsule so it follows the body curve) -->
  <g clip-path="url(#bodyClip)">
    <path d="M40 160 V228 H216 V160 Z" fill="url(#denimGrad)"/>
    <!-- Overalls top line highlight -->
    <path d="M40 160 H216" stroke="#5388c8" stroke-width="1.5" opacity="0.5"/>
    <path d="M40 161.5 H216" stroke="#1d3a64" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Overall straps -->
  <g>
    <rect x="92"  y="110" width="11" height="60" rx="2" fill="url(#denimGrad)"/>
    <rect x="153" y="110" width="11" height="60" rx="2" fill="url(#denimGrad)"/>
    <!-- subtle strap shading -->
    <rect x="92"  y="110" width="11" height="60" rx="2" fill="none" stroke="#1d3a64" stroke-width="0.8" opacity="0.6"/>
    <rect x="153" y="110" width="11" height="60" rx="2" fill="none" stroke="#1d3a64" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- Strap buttons (yellow) -->
  <circle cx="97.5"  cy="166" r="3.6" fill="#facd2e" stroke="#8a6c12" stroke-width="0.8"/>
  <circle cx="158.5" cy="166" r="3.6" fill="#facd2e" stroke="#8a6c12" stroke-width="0.8"/>

  <!-- Front pocket -->
  <rect x="106" y="180" width="44" height="26" rx="3" fill="none" stroke="#1d3a64" stroke-width="1.5" opacity="0.8"/>
  <path d="M106 188 H150" stroke="#1d3a64" stroke-width="1" opacity="0.5"/>

  <!-- Goggle strap (horizontal band across face) -->
  <rect x="40" y="86" width="176" height="14" fill="#1f1f1f"/>
  <rect x="40" y="86" width="176" height="2" fill="#3a3a3a"/>
  <rect x="40" y="98" width="176" height="2" fill="#0a0a0a"/>

  <!-- Goggle outer ring (chrome) -->
  <circle cx="128" cy="93" r="34" fill="url(#chromeGrad)"/>
  <circle cx="128" cy="93" r="34" fill="none" stroke="#4a4a4a" stroke-width="1.5"/>

  <!-- Goggle inner ring (darker) -->
  <circle cx="128" cy="93" r="29" fill="#1c1c1c"/>

  <!-- Eye white -->
  <circle cx="128" cy="93" r="25" fill="#fafafa"/>

  <!-- Iris -->
  <circle cx="131" cy="93" r="11" fill="url(#irisGrad)"/>

  <!-- Pupil -->
  <circle cx="132.5" cy="93" r="5.2" fill="#0a0a0a"/>

  <!-- Catch lights -->
  <circle cx="135.5" cy="89" r="2.6" fill="#fff"/>
  <circle cx="129"   cy="97" r="1.2" fill="#fff" opacity="0.6"/>

  <!-- Goggle reflection arc (subtle) -->
  <path d="M104 80 Q116 70 132 72" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.35"/>

  <!-- Smile -->
  <path d="M104 138 Q128 162 152 138" stroke="#1a1310" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  <!-- Smile shadow (inner mouth hint) -->
  <path d="M109 140 Q128 158 147 140" fill="#1a1310" opacity="0.45"/>

  <!-- Tooth -->
  <rect x="124.5" y="144" width="7" height="6" rx="1" fill="#fafafa"/>
  <rect x="124.5" y="144" width="7" height="6" rx="1" fill="none" stroke="#1a1310" stroke-width="0.6"/>
</svg>
