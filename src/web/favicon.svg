<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- shadow -->
  <ellipse cx="32" cy="60" rx="18" ry="2" fill="#000" opacity="0.15"/>

  <!-- body (yellow capsule) -->
  <rect x="10" y="8" width="44" height="50" rx="22" ry="22" fill="#fcd33b"/>

  <!-- body outline highlight -->
  <rect x="10" y="8" width="44" height="50" rx="22" ry="22" fill="none" stroke="#caa120" stroke-width="1.2"/>

  <!-- hair tufts -->
  <path d="M22 10 l-2 -3 M28 8.5 l-1 -3.5 M34 8.5 l1 -3.5 M40 10 l2 -3"
        stroke="#3a2a16" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- goggle strap (horizontal band) -->
  <rect x="10" y="22" width="44" height="6" fill="#2a2a2a"/>

  <!-- goggle ring (outer dark) -->
  <circle cx="32" cy="25" r="10" fill="#bfbfbf"/>
  <circle cx="32" cy="25" r="10" fill="none" stroke="#5a5a5a" stroke-width="1.4"/>

  <!-- eye white -->
  <circle cx="32" cy="25" r="7" fill="#fafafa"/>

  <!-- iris -->
  <circle cx="33" cy="25" r="3.2" fill="#5b3b1f"/>

  <!-- pupil -->
  <circle cx="33.5" cy="25" r="1.6" fill="#101010"/>

  <!-- catch-light -->
  <circle cx="34.5" cy="23.8" r="0.8" fill="#fff"/>

  <!-- smile -->
  <path d="M25 38 Q32 44 39 38" stroke="#1a1a1a" stroke-width="1.8"
        stroke-linecap="round" fill="none"/>
  <!-- tooth hint -->
  <rect x="30.5" y="39.2" width="2.4" height="1.8" fill="#fafafa"/>

  <!-- overalls (blue bottom) -->
  <path d="M10 47 v9 a22 22 0 0 0 44 0 v-9 Z" fill="#3b6ea8"/>
  <!-- overalls outline -->
  <path d="M10 47 h44" stroke="#27497a" stroke-width="1"/>

  <!-- overall straps -->
  <rect x="22.5" y="28" width="2.4" height="19" fill="#3b6ea8"/>
  <rect x="39.1" y="28" width="2.4" height="19" fill="#3b6ea8"/>
  <!-- strap buttons -->
  <circle cx="23.7" cy="48" r="1.2" fill="#fcd33b"/>
  <circle cx="40.3" cy="48" r="1.2" fill="#fcd33b"/>

  <!-- front pocket -->
  <rect x="26" y="50" width="12" height="6" rx="1" fill="none" stroke="#27497a" stroke-width="1"/>
</svg>
