<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" aria-label="Loading minion">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd84a"/>
      <stop offset="1" stop-color="#f5b800"/>
    </linearGradient>
    <radialGradient id="eyeShine" cx="0.4" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Bobbing group -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -6; 0 0; 0 -3; 0 0" keyTimes="0;0.25;0.5;0.75;1" dur="1.8s" repeatCount="indefinite"/>

    <!-- Hair tufts -->
    <g stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round" fill="none">
      <path d="M52 16 L48 4"/>
      <path d="M62 14 L62 2"/>
      <path d="M72 16 L78 5"/>
    </g>

    <!-- Body -->
    <rect x="32" y="18" width="56" height="86" rx="28" fill="url(#bodyGrad)" stroke="#1b1b1b" stroke-width="2.5"/>

    <!-- Goggle strap -->
    <rect x="32" y="38" width="56" height="6" fill="#1b1b1b"/>

    <!-- Goggle metal ring -->
    <circle cx="60" cy="41" r="15" fill="#cfd3d8" stroke="#1b1b1b" stroke-width="2.5"/>
    <circle cx="60" cy="41" r="10" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>

    <!-- Pupil — blinks with scaleY -->
    <g>
      <ellipse cx="60" cy="41" rx="4.2" ry="5.4" fill="#1b1b1b">
        <animate attributeName="ry" values="5.4;5.4;0.5;5.4;5.4" keyTimes="0;0.85;0.9;0.95;1" dur="3.4s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="58.5" cy="39" r="1.6" fill="#ffffff"/>
      <circle cx="60" cy="41" r="8" fill="url(#eyeShine)"/>
    </g>

    <!-- Smile -->
    <path d="M50 64 Q60 72 70 64" fill="none" stroke="#1b1b1b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Tooth -->
    <rect x="58.5" y="65.5" width="3" height="4" fill="#ffffff" stroke="#1b1b1b" stroke-width="1"/>

    <!-- Overalls bib -->
    <path d="M36 80 L84 80 L84 104 Q84 110 78 110 L42 110 Q36 110 36 104 Z" fill="#3a78c9" stroke="#1b1b1b" stroke-width="2.5"/>
    <!-- Pocket -->
    <rect x="51" y="86" width="18" height="14" fill="none" stroke="#1b1b1b" stroke-width="2"/>
    <!-- Straps -->
    <path d="M44 80 L44 60" stroke="#3a78c9" stroke-width="6" stroke-linecap="round"/>
    <path d="M76 80 L76 60" stroke="#3a78c9" stroke-width="6" stroke-linecap="round"/>
    <circle cx="44" cy="80" r="2.2" fill="#1b1b1b"/>
    <circle cx="76" cy="80" r="2.2" fill="#1b1b1b"/>
  </g>

  <!-- Shadow that breathes with the bob -->
  <ellipse cx="60" cy="128" rx="28" ry="4" fill="#000000" opacity=".22">
    <animate attributeName="rx" values="28;22;28;25;28" keyTimes="0;0.25;0.5;0.75;1" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".22;.32;.22;.27;.22" keyTimes="0;0.25;0.5;0.75;1" dur="1.8s" repeatCount="indefinite"/>
  </ellipse>
</svg>
